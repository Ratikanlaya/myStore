<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ร้านยาจำลอง · หน้าแรก</title>
<script>/* โหมดมืด: อ่านค่าที่เลือกไว้ ถ้าไม่เคยเลือกให้ตามการตั้งค่าของเครื่อง */(function(){var t='';try{t=sessionStorage.getItem('theme')||''}catch(e){}if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
<style>
  :root{color-scheme:light;--bg:#FFFFFF;--card:#F5F1E8;--card2:#FFFFFF;--ink:#1A1A1A;--muted:#595959;--line:rgba(128,128,128,.4);--hover:rgba(128,128,128,.14);--primary:#1A1A1A;--on-primary:#FFFFFF;--neutral:#808080;--warn:#B38B6D;--on-warn:#1A1A1A;--err:#B3261E;--pink:rgba(179,38,30,.08);--pink2:rgba(179,38,30,.16);--card-hover:#EDE6D6;--accent:#1A1A1A;--lime:#F5F1E8}
  html[data-theme=dark]{color-scheme:dark;--bg:#111111;--card:#1C1C1C;--card2:#262626;--ink:#F5F1E8;--muted:#A6A6A6;--line:rgba(128,128,128,.45);--hover:rgba(128,128,128,.2);--primary:#F5F1E8;--on-primary:#111111;--neutral:#808080;--warn:#B38B6D;--on-warn:#111111;--err:#E5736B;--pink:rgba(229,115,107,.14);--pink2:rgba(229,115,107,.26);--card-hover:#262626;--accent:#F5F1E8;--lime:#1C1C1C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.6}
  main{max-width:720px;margin:0 auto;padding:32px 18px 48px}
  h1{font-size:28px;line-height:1.3;margin:0 0 6px}
  .lead{color:var(--muted);margin:0 0 24px}
  .menu{list-style:none;margin:0;padding:0;display:grid;gap:14px}
  .menu a{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px;padding:16px 20px;
    background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none}
  .menu a:hover{background:var(--card-hover);border-color:var(--accent)}
  .menu a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .menu .title{display:block;font-size:19px;font-weight:700}
  .menu .desc{display:block;color:var(--muted);font-size:15px}
  .menu .arrow{color:var(--accent);font-size:24px;flex:none}
  .back{display:inline-block;margin-bottom:18px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--ink);border-color:var(--accent)}
  .back:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .notice{margin-top:28px;padding:14px 16px;border-left:4px solid var(--accent);background:var(--lime);border-radius:10px;color:var(--ink)}
  .theme-toggle{position:fixed;top:16px;right:16px;z-index:100;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer;white-space:nowrap}
  .theme-toggle:hover{background:var(--hover)}
  .theme-toggle:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
</style>
</head>
<body>
<main>
  <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">โหมดมืด: ปิด</button>
  <!-- เมนูย้อนกลับไปหน้าแรกของเว็บไซต์ (แก้ href ได้ถ้าหน้าแรกอยู่ที่อื่น) -->
  <a class="back" href="https://ratikanlaya.github.io/BMI/">← กลับหน้าแรก</a>
  <h1>ร้านยาจำลอง</h1>
  <p class="lead">เลือกหน้าที่ต้องการใช้งาน</p>
  <nav aria-label="เมนูหลัก"><ul class="menu" id="menu"></ul></nav>
  <p class="notice">ข้อมูลทั้งหมดเป็นข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง</p>
</main>
<script>
'use strict';
// รายการลิงก์: เพิ่มหรือลบหน้าได้ด้วยการแก้หนึ่งบรรทัดในอาร์เรย์นี้
// ปุ่มที่ชี้ไปหน้าที่ยังไม่ได้ push จะขึ้น 404 ชั่วคราว ซึ่งเป็นเรื่องปกติ
const LINKS = [
  { href: 'pos.html',       title: 'หน้าขายยา',            desc: 'เลือกยา กรอกจำนวน บันทึกการจ่ายยา' },
  { href: 'admin.html',     title: 'จัดการระบบ (ผู้ดูแล)', desc: 'บัญชียา คลังรายล็อต รายการจ่าย ต้องใช้รหัสผู้ดูแล' },
  { href: 'dashboard.html', title: 'Dashboard คลังยา',     desc: 'ภาพรวมคลัง ล็อตใกล้หมดอายุ ยาต่ำกว่าจุดสั่งซื้อ' },
  { href: 'status.html',    title: 'ตรวจสถานะระบบ',        desc: 'ตรวจว่าการเชื่อมต่อแต่ละส่วนทำงานปกติ' },
];

// สร้างปุ่มด้วย createElement และ textContent (ไม่ประกอบ HTML จากข้อความ)
const menu = document.getElementById('menu');
for (const link of LINKS) {
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.href = link.href;
  const text = document.createElement('span');
  const title = document.createElement('span');
  title.className = 'title';
  title.textContent = link.title;
  const desc = document.createElement('span');
  desc.className = 'desc';
  desc.textContent = link.desc;
  text.append(title, desc);
  const arrow = document.createElement('span');
  arrow.className = 'arrow';
  arrow.setAttribute('aria-hidden', 'true');
  arrow.textContent = '›';
  a.append(text, arrow);
  li.append(a);
  menu.append(li);
}
</script>
<script>/* ปุ่มเปิด/ปิดโหมดมืด มุมขวาบน */(function(){var b=document.getElementById('themeToggle'),h=document.documentElement;function sync(){var on=h.getAttribute('data-theme')==='dark';b.setAttribute('aria-pressed',on?'true':'false');b.textContent=on?'โหมดมืด: เปิด':'โหมดมืด: ปิด';}b.addEventListener('click',function(){var on=h.getAttribute('data-theme')!=='dark';if(on)h.setAttribute('data-theme','dark');else h.removeAttribute('data-theme');try{sessionStorage.setItem('theme',on?'dark':'light')}catch(e){}sync();});sync();})();</script>
</body>
</html>
