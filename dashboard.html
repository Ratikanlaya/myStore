font-size:14px;padding:12px 19px}.tab.active{background:var(--ink);color:var(--bg)}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:16px}.kpi{padding:20px;border-radius:24px;background:var(--soft);min-height:136px}.kpi:nth-child(5n+1){background:var(--lime);color:#111}.kpi:nth-child(5n+2){background:var(--lilac);color:#111}.kpi:nth-child(5n+3){background:var(--cream);color:#111}.kpi:nth-child(5n+4){background:var(--mint);color:#111}.kpi:nth-child(5n+5){background:var(--pink);color:#111}.kpi .label{font-size:12px;font-weight:700}.kpi .value{font-size:clamp(24px,3vw,34px);font-weight:750;line-height:1.25;margin:10px 0 4px;letter-spacing:-1px}.kpi small{color:#363636;font-size:11px}.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:21px;min-width:0}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bars{display:grid;gap:12px;margin-top:18px}.barrow{display:grid;grid-template-columns:minmax(90px,135px) 1fr 70px;gap:10px;align-items:center;font-size:12px}.barrow .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}.fill{height:100%;background:#9680d9;border-radius:99px}.barrow strong{text-align:right;font-variant-numeric:tabular-nums}.trend{width:100%;height:210px;display:block}.chart-empty{padding:30px;text-align:center;color:var(--muted)}.tablewrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:13px}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:12px}td,th{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line)}th{background:var(--soft);position:sticky;top:0;font-size:11px}tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--soft)}.tag{border-radius:999px;background:var(--soft);padding:4px 9px;font-size:11px;display:inline-block}.tag.bad{background:#f9d7dc;color:#8c1b2b}.tag.warn{background:#ffe6bf;color:#834400}.tag.good{background:#d4eed8;color:#17592f}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:9px}.toolbar input{flex:1;min-width:180px}.info{border-radius:15px;padding:14px 18px;background:var(--soft);font-size:12px;margin-bottom:16px}.alert{background:var(--coral);color:#23190f}.hidden{display:none!important}.footer{color:var(--muted);font-size:12px;margin:30px 0}.error{color:var(--danger);font-weight:700}.status{font-size:12px;max-width:380px}.switch{display:flex;align-items:center;gap:7px;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-weight:650}.switch input{appearance:none;width:40px;height:23px;border-radius:30px;background:#c9c9c9;position:relative;cursor:pointer;margin:0}.switch input:after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .2s}.switch input:checked{background:#5a4a93}.switch input:checked:after{transform:translateX(17px)}.pagination{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;flex-wrap:wrap}#picker{display:none}.toast{margin:12px 0}.hint{font-size:12px;color:var(--muted)}@media(max-width:980px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.cols{grid-template-columns:1fr}}@media(max-width:620px){.shell{padding:18px 12px}.head{padding:12px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{min-height:120px;padding:15px}.barrow{grid-template-columns:95px 1fr 55px}.panel{padding:14px}}

iv></div><button id="exportTable">↓ CSV</button></div><div class="toolbar"><input id="search" placeholder="ค้นหา SKU, ชื่อยา, Lot, รายการ..." aria-label="ค้นหาตาราง"><select id="statusFilter" aria-label="กรองสถานะ"><option value="">ทุกสถานะ</option></select></div><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="pagination"><span id="rowCount"></span><div><button id="prev">ก่อนหน้า</button> <span id="pageNum"></span> <button id="next">ถัดไป</button></div></div></article><div class="footer" id="footerNote">กำลังตรวจแหล่งข้อมูล…</div></main>
<script>
'use strict';const $=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)],F=['drugs_update.json','stock.json','dispense-log.json'];let D=null,mode='stock',rows=[],filtered=[],page=0,head=[],fstatus=[],note='',pageSize=15;const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>new Intl.NumberFormat('th-TH',{maximumFractionDigits:2}).format(n);const money=n=>'฿'+new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);const dt=s=>s?new Date(String(s).slice(0,10)+'T12:00:00+07:00'):null;const dayDiff=(a,b)=>Math.round((dt(a)-dt(b))/86400000);const addDays=(d,n)=>{let x=dt(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};const cnt=(a,k)=>{let m=new Map;for(let x of a)m.set(x[k],(m.get(x[k])||0)+1);return [...m].sort((a,b)=>b[1]-a[1])};
// ===== โหลดข้อมูล: เรียก API ของเราเอง /api/data เท่านั้น =====
// ไม่มี key ในหน้าเว็บ ไม่ใช้ supabase-js และไม่เรียก URL ของ Supabase ตรง (key อยู่ใน env ของ Vercel ฝั่ง api/data.js)
// ถือว่าล้มเหลวเมื่อ: สถานะไม่ใช่ 200, เกิน 8 วินาที, หรือ JSON ไม่มี drugs/stock/dispense_log
async function fetchApiData(){const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),8000);try{const r=await fetch('/api/data',{cache:'no-store',signal:ctl.signal});if(r.status!==200)throw Error('/api/data ตอบ '+r.status);const j=await r.json();if(!j?.drugs?.items||!j?.stock?.items||!j?.dispense_log?.items)throw Error('/api/data ไม่มี drugs/stock/dispense_log');return j}finally{clearTimeout(timer)}}
// ===== ทางสำรอง: อ่านไฟล์ JSON เดิม (ไม่ใช่ข้อมูลล่าสุด) =====
// ลอง ./data/ ก่อนตามโครงสร้างโปรเจกต์ ถ้าไม่พบจึงลองโฟลเดอร์เดียวกับหน้าเว็บ (ไฟล์ใน zip เดิมวางไว้ที่นี่)
const FALLBACK_DIRS=['./data/','./'];
async function fetchFallback(name){for(const dir of FALLBACK_DIRS){try{const r=await fetch(dir+name,{cache:'no-store'});if(r.ok)return await r.json()}catch(_){}}throw Error('ไม่พบ '+name)}
const LIVE_SERVER_MSG='ทดสอบผ่านลิงก์ Vercel เท่านั้น (Live Server ไม่รัน /api)';
function mapData(data){let bySku=new Map(data.drugs.items.map(x=>[x.sku,x]));let byLot=new Map(data.stock.items.map(x=>[x.sku+'|'+x.lot,x]));return {...data,bySku,byLot}};
function validate(data){if(!data.drugs?.items?.length||!data.stock?.items||!data.log?.items)throw Error('รูปแบบ JSON ไม่ถูกต้อง: ต้องมี meta และ items ทั้งสามไฟล์');if(!data.drugs.items[0].generic_name||!data.stock.items[0].qty_on_hand && data.stock.items[0].qty_on_hand!==0||!data.log.items[0].dispense_id)throw Error('ชนิดข้อมูลไม่ตรงกับที่ต้องการ')}
async function loadFiles(fileList){try{let tmp={};for(let f of fileList){let d=JSON.parse(await f.text());let obj=d.items?.[0]||{};if('generic_name'in obj)tmp.drugs=d;else if('stock_id'in obj)tmp.stock=d;else if('dispense_id'in obj)tmp.log=d;}validate(tmp);init(tmp,'file','เลือกจากเครื่อง '+fileList.length+' ไฟล์')}catch(e){$('#loadingInfo').textContent='อ่านไฟล์ไม่สำเร็จ: '+e.message;$('#loadingInfo').classList.add('error')}}
async function autoLoad(){try{const j=await fetchApiData();let tmp={drugs:j.drugs,stock:j.stock,log:j.dispense_log};validate(tmp);init(tmp,'supabase');return}catch(e){console.warn('/api/data ใช้ไม่ได้ เปลี่ยนไปใช้ไฟล์สำรอง:',e.message)}// ทางสำรอง: ไฟล์ JSON 3 ไฟล์
try{let dat=await Promise.all(F.map(fetchFallback));let tmp={drugs:dat[0],stock:dat[1],log:dat[2]};validate(tmp);init(tmp,'fallback','drugs_update.json, stock.json, dispense-log.json')}catch(e){$('#loadingInfo').textContent='โหลดข้อมูลไม่สำเร็จ: '+LIVE_SERVER_MSG+' · หรือกด “เลือก JSON 3 ไฟล์” ด้านบน';$('#loadingInfo').classList.add('error');$('#fileStatus').textContent='โหลดข้อมูลไม่สำเร็จ';$('#footerNote').textContent=LIVE_SERVER_MSG}}

function setSource(src,detail){D.src=src;let st=$('#fileStatus'),bar=$('#srcBar');if(src==='supabase'){st.className='status srcbadge';st.textContent='● ข้อมูลจาก Supabase · as_of '+D.stock.meta.as_of;bar.hidden=true;$('#footerNote').textContent='ข้อมูลจาก Supabase ผ่าน /api/data · as_of '+D.stock.meta.as_of+' · คำนวณในเบราว์เซอร์ · หน้าเว็บไม่มี key และอ่านได้อย่างเดียว'}else{st.className='status srcbadge fallback';st.textContent='ข้อมูลสำรองจากไฟล์';bar.hidden=false;bar.textContent='⚠ ข้อมูลสำรองจากไฟล์ (ไม่ใช่ข้อมูลล่าสุด) · '+detail;$('#footerNote').textContent='ข้อมูลสำรองจากไฟล์ '+detail+' · ไม่ใช่ข้อมูลล่าสุด · คำนวณในเบราว์เซอร์'}}
const stockSrc=()=>D.src==='supabase'?'ตาราง stock (Supabase)':'stock.json';
function init(data,src,detail){D=mapData(data);setSource(src,detail);$('#loadingInfo').textContent='✓ โหลดสำเร็จ: '+D.drugs.items.length+' SKU · '+D.stock.items.length+' ล็อต · '+D.log.items.length+' รายการ';$('#loadingInfo').classList.remove('error');let dates=D.log.items.map(x=>x.datetime.slice(0,10)).sort();$('#fromDate').value=dates[0];$('#toDate').value=dates.at(-1);$('#fromDate').min=dates[0];$('#toDate').max=dates.at(-1);$('#asOf').value=D.stock.meta.as_of||dates.at(-1);render()}
function kpis(a){$('#kpis').innerHTML=a.map(([label,value,detail])=>`<div class="kpi"><div class="label">${safe(label)}</div><div class="value">${safe(value)}</div><small>${safe(detail)}</small></div>`).join('')}
function bars(target,data,opts={}){let max=Math.max(1,...data.map(x=>x[1]));$(target).innerHTML=data.length?`<div class="bars">${data.map(([name,val])=>`<div class="barrow"><span class="name" title="${safe(name)}">${safe(name)}</span><div class="track"><div class="fill" style="width:${Math.max(0,val/max*100)}%;background:${opts.color||'#9680d9'}"></div></div><strong>${opts.currency?money(val):fmt(val)}</strong></div>`).join('')}</div>`:'<p class="chart-empty">ไม่มีข้อมูลในเงื่อนไขที่เลือก</p>'}
function trend(target,data){if(!data.length){$(target).innerHTML='<p class="chart-empty">ไม่มีข้อมูล</p>';return}let w=620,h=210,p=28,max=Math.max(1,...data.map(x=>x[1]));let points=data.map(([x,v],i)=>[(p+i*(w-2*p)/Math.max(1,data.length-1)),h-p-v/max*(h-2*p)]);let ps=points.map(x=>x.join(',')).join(' ');$(target).innerHTML=`<svg viewBox="0 0 ${w} ${h}" class="trend" role="img" aria-label="กราฟจำนวนรายการจ่ายยารายวัน"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="currentColor" opacity=".3"/><polyline points="${ps}" fill="none" stroke="#a18ae9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>${points.map((xy,i)=>`<circle cx="${xy[0]}" cy="${xy[1]}" r="3" fill="#7253c1"><title>${safe(data[i][0])}: ${data[i][1]}</title></circle>`).join('')}<text x="${p}" y="${h-4}" fill="currentColor" font-size="10">${safe(data[0][0])}</text><text x="${w-p}" y="${h-4}" text-anchor="end" fill="currentColor" font-size="10">${safe(data.at(-1)[0])}</text><text x="${p}" y="15" fill="currentColor" font-size="10">สูงสุด ${fmt(max)}</text></svg>`}
function chartTitles(a,b,c,d){$('#chartTitle').textContent=a;$('#chartSub').textContent=b;$('#chart2Title').textContent=c;$('#chart2Sub').textContent=d}
function setTable(title,subtitle,headers,data,statuses){$('#tableTitle').textContent=title;$('#tableSub').textContent=subtitle;head=headers;rows=data;fstatus=statuses||[];let sel=$('#statusFilter');sel.innerHTML='<option value="">ทุกสถานะ</option>'+fstatus.map(x=>`<option value="${safe(x)}">${safe(x)}</option>`).join('');$('#search').value='';page=0;applyFilter()}
function applyFilter(){let q=$('#search').value.toLowerCase().trim(),st=$('#statusFilter').value;filtered=rows.filter(r=>(!q||r.some(c=>String(c??'').toLowerCase().includes(q)))&&(!st||String(r.at(-1))===st));page=0;renderTable()}
function renderTable(){let allPages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.min(Math.max(page,0),allPages-1);$('#thead').innerHTML='<tr>'+head.map(h=>`<th>${safe(h)}</th>`).join('')+'</tr>';let part=filtered.slice(page*pageSize,(page+1)*pageSize);$('#tbody').innerHTML=part.length?part.map(r=>'<tr>'+r.map((v,i)=>`<td>${i===r.length-1?`<span class="tag ${/หมดอายุ|กักกัน|ต่ำกว่าเกณฑ์|ไม่ตรง|ผิดปกติ|ข้อมูลไม่ครบ/i.test(String(v))?'bad':/ใกล้หมด|ควรสั่ง|เตือน/i.test(String(v))?'warn':'good'}">${safe(v)}</span>`:safe(v)}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${head.length}">ไม่พบข้อมูล</td></tr>`;$('#rowCount').textContent=`${filtered.length} รายการ`;$('#pageNum').textContent=`${page+1}/${allPages}`;$('#prev').disabled=page===0;$('#next').disabled=page===allPages-1}
function stockView(){let d=D.stock.items,m=D.bySku,ref=$('#asOf').value,h=Number($('#horizon').value);let active=d.filter(x=>x.status==='active'&&x.qty_on_hand>0);let near=active.filter(x=>x.expiry&&dayDiff(x.expiry,ref)>=0&&dayDiff(x.expiry,ref)<=h);let expired=d.filter(x=>x.expiry&&dayDiff(x.expiry,ref)<0&&x.qty_on_hand>0);let val=active.reduce((s,x)=>s+x.qty_on_hand*x.unit_cost,0);kpis([['Active Stock Value',money(val),'ต้นทุนล็อต Active คงเหลือ >0'],['Active Lots',active.length,'ล็อตที่มีจำนวนคงเหลือ'],['Near Expiry',near.length,`หมดอายุภายใน ${h} วัน`],['Expired Stock',expired.length,'ล็อตมีคงเหลือและหมดอายุแล้ว'],['Quarantine',d.filter(x=>x.status==='quarantine').length,'ล็อตที่ไม่ควรจ่าย']]);chartTitles('Lot Status','จำนวนล็อตทั้งหมดตามสถานะ','Expiry Window',`ล็อต Active ที่หมดอายุใน ${h} วัน หลังวันอ้างอิง`);bars('#chart1',cnt(d,'status'));let bins=[['หมดอายุแล้ว',expired.length],['0–30 วัน',active.filter(x=>x.expiry&&dayDiff(x.expiry,ref)>=0&&dayDiff(x.expiry,ref)<=30).length],['31–90 วัน',active.filter(x=>x.expiry&&dayDiff(x.expiry,ref)>30&&dayDiff(x.expiry,ref)<=90).length],['91–180 วัน',active.filter(x=>x.expiry&&dayDiff(x.expiry,ref)>90&&dayDiff(x.expiry,ref)<=180).length],['มากกว่า 180 วัน',active.filter(x=>x.expiry&&dayDiff(x.expiry,ref)>180).length]];bars('#chart2',bins,{color:'#a2cfa9'});let rr=d.map(x=>{let days=x.expiry?dayDiff(x.expiry,ref):null;let status=x.status==='quarantine'?'กักกัน':x.status==='written_off'?'ตัดจำหน่าย':x.qty_on_hand===0?'ไม่มีคงเหลือ':!x.expiry?'ข้อมูลไม่ครบ':days<0?'หมดอายุ':days<=h?'ใกล้หมดอายุ':'ปกติ';return [x.stock_id,x.sku,m.get(x.sku)?.generic_name||'—',x.lot,x.expiry||'ไม่ระบุ',fmt(x.qty_on_hand),m.get(x.sku)?.unit||'',money(x.qty_on_hand*x.unit_cost),status]});setTable('Stock by Lot','แสดงทุกรายล็อต พร้อมสถานะและวันหมดอายุ',['Stock ID','SKU','ชื่อยา','Lot','Expiry','Qty','Unit','มูลค่า','สถานะ'],rr,[...new Set(rr.map(x=>x.at(-1)))]);$('#snapshotNote').textContent=`ยอดสต็อกจาก ${stockSrc()} เป็น Snapshot ณ ${D.stock.meta.as_of} แม้จะเลือกวันตรวจสอบอื่น ค่า qty_on_hand และมูลค่ายังคงเป็นยอด Snapshot เดิม ไม่ใช่ประวัติสต็อกย้อนหลัง`}
function purchasingView(){let ref=$('#asOf').value,h=Number($('#horizon').value),stocks=D.stock.items,bySku=D.bySku;let groups=new Map;for(let s of stocks){if(!groups.has(s.sku))groups.set(s.sku,[]);groups.get(s.sku).push(s)}let records=[...groups].map(([sku,lots])=>{let drug=bySku.get(sku),ready=lots.filter(x=>x.status==='active'&&x.qty_on_hand>0&&x.expiry&&dayDiff(x.expiry,ref)>=0).reduce((n,x)=>n+x.qty_on_hand,0),threshold=Number(drug?.reorder_level||0),gap=Math.max(0,threshold-ready),near=lots.filter(x=>x.status==='active'&&x.expiry&&dayDiff(x.expiry,ref)>=0&&dayDiff(x.expiry,ref)<=h).length;return {sku,name:drug?.generic_name||'—',unit:drug?.unit||'—',ready,threshold,gap,near,status:ready<threshold?'ต่ำกว่าเกณฑ์':'เพียงพอตามเกณฑ์'}}).sort((a,b)=>b.gap-a.gap);let low=records.filter(x=>x.gap>0);kpis([['Stocked SKUs',records.length,`SKU ที่มีสต็อก จาก ${D.drugs.items.length} SKU`],['Below Reorder',low.length,'ยอดใช้ได้ < reorder_level'],['Potential Order Lines',low.length,'จำนวนรายการที่ต้องพิจารณา'],['Near-expiry SKUs',records.filter(x=>x.near>0).length,`ภายใน ${h} วัน`],['Unstocked Master',D.drugs.items.length-records.length,'ไม่มีในชุดสต็อก (ไม่ใช่ stockout)']]);chartTitles('Reorder Candidates','เรียง SKU ที่มีส่วนต่างต่ำกว่าเกณฑ์มากที่สุด','Inventory Value by Category','มูลค่าต้นทุนล็อต Active ตามหมวดหมู่');bars('#chart1',low.slice(0,10).map(x=>[x.sku,x.gap]),{color:'#d5a6a6'});let vals=new Map;for(let x of stocks.filter(x=>x.status==='active')){let cat=bySku.get(x.sku)?.category||'ไม่พบหมวดหมู่';vals.set(cat,(vals.get(cat)||0)+x.qty_on_hand*x.unit_cost)}bars('#chart2',[...vals].sort((a,b)=>b[1]-a[1]).slice(0,9),{currency:true,color:'#c5b0f4'});setTable('Suggested Reorder Review','ส่วนต่าง = max(0, reorder_level − ยอดพร้อมจ่าย ณ วันตรวจสอบ) ไม่ใช่ใบสั่งซื้อจริง',['SKU','ชื่อยา','หน่วย','พร้อมจ่าย','Reorder Level','ส่วนต่าง','ล็อตใกล้หมด','สถานะ'],records.map(x=>[x.sku,x.name,x.unit,fmt(x.ready),fmt(x.threshold),fmt(x.gap),x.near,x.status]),['ต่ำกว่าเกณฑ์','เพียงพอตามเกณฑ์']);$('#snapshotNote').textContent=`คำนวณจากล็อต Active ที่ยังไม่หมดอายุ ณ วันตรวจสอบ ${ref}; ปริมาณใน ${stockSrc()} เป็น Snapshot ${D.stock.meta.as_of} ไม่สามารถสรุปจำนวนคงเหลือจริงย้อนหลังหรือในอนาคตได้ และไม่มีประวัติใบสั่งซื้อ/ผู้ขายในข้อมูลชุดนี้`}
function dispenseView(){let from=$('#fromDate').value,to=$('#toDate').value;let logs=D.log.items.filter(x=>(!from||x.datetime.slice(0,10)>=from)&&(!to||x.datetime.slice(0,10)<=to));let disp=logs.filter(x=>x.type==='dispense');let patients=new Set(disp.map(x=>x.patient_code));let incidents=logs.filter(x=>{if(x.incident_ref)return true;if(x.type!=='dispense')return false;let l=D.byLot.get(x.sku+'|'+x.lot);return !!(l&&l.expiry&&x.datetime.slice(0,10)>l.expiry)});let mismatches=logs.filter(x=>!D.byLot.has(x.sku+'|'+x.lot));kpis([['Dispense Events',disp.length,'รายการ type=dispense'],['Patient Codes',patients.size,'รหัสผู้ป่วยไม่ซ้ำ'],['Dispensed SKUs',new Set(disp.map(x=>x.sku)).size,'รายการยาไม่ซ้ำ'],['Void Events',logs.filter(x=>x.type==='void').length,'แยกจากยอดจ่าย'],['Return Events',logs.filter(x=>x.type==='return').length,'รับคืน แยกจากยอดจ่าย'],['Flagged Entries',new Set([...incidents,...mismatches].map(x=>x.dispense_id)).size,'จ่ายหลังหมดอายุ/incident หรือคู่ SKU/Lot ไม่ตรง']]);chartTitles('Daily Dispensing Events','จำนวนบันทึกจ่ายยาในช่วงวันที่ที่เลือก','Top Dispensed SKU','จำนวนครั้งที่จ่าย ไม่ใช่ยอดขายหรือราคายา');let days=new Map;for(let x of disp){let d=x.datetime.slice(0,10);days.set(d,(days.get(d)||0)+1)}trend('#chart1',[...days].sort((a,b)=>a[0].localeCompare(b[0])));bars('#chart2',cnt(disp,'sku').slice(0,9),{color:'#a5cfae'});let rows=logs.slice().sort((a,b)=>b.datetime.localeCompare(a.datetime)).map(x=>{let lot=D.byLot.get(x.sku+'|'+x.lot);let warn=!lot?'ล็อตไม่ตรง':x.incident_ref?'มี Incident':x.type==='void'?'Void':x.type==='return'?'Return':lot.expiry&&x.datetime.slice(0,10)>lot.expiry?'จ่ายหลังหมดอายุ':'บันทึกปกติ';return[x.dispense_id,x.datetime.replace('T',' ').slice(0,16),x.sku,D.bySku.get(x.sku)?.generic_name||'—',x.lot,fmt(x.qty),x.patient_code,x.pharmacist_code,x.type,warn]});setTable('Dispensing Transaction Log',`บันทึก ${from||'เริ่มต้น'} ถึง ${to||'ล่าสุด'} · แสดงการแจ้งเตือนย้อนหลังตามล็อตและเหตุการณ์ที่มีในไฟล์`,['ID','วันเวลา','SKU','ชื่อยา','Lot','Qty','Patient','Pharmacist','Type','ตรวจสอบ'],rows,[...new Set(rows.map(x=>x.at(-1)))]);$('#snapshotNote').textContent=`กรองรายการจ่ายยาตาม datetime จริง; รายการ Void และ Return ไม่ถูกนับเป็น dispense. ข้อมูลไม่มีราคาขาย จึงไม่แสดงรายได้หรือกำไร และไม่ใช้ Log ไปลบยอด Snapshot สต็อกซ้ำ`}
function render(){if(!D)return;all('.tab').forEach(x=>{let on=x.dataset.tab===mode;x.classList.toggle('active',on);x.setAttribute('aria-selected',on?'true':'false')});({stock:stockView,purchase:purchasingView,dispense:dispenseView})[mode]()}
function csv(){if(!head.length)return;let quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"',data='\uFEFF'+[head,...filtered].map(r=>r.map(quote).join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='pharmascope_'+mode+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
$('#darkMode').addEventListener('change',e=>{document.documentElement.dataset.theme=e.target.checked?'dark':'light';try{localStorage.setItem('pharmaDark',e.target.checked?'1':'0')}catch(_){}});try{if(localStorage.getItem('pharmaDark')==='1'){$('#darkMode').checked=true;document.documentElement.dataset.theme='dark'}}catch(_){}$('#loadBtn').onclick=()=>$('#picker').click();$('#picker').onchange=e=>{if(e.target.files.length)loadFiles([...e.target.files])};all('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.tab;render()});for(let id of ['fromDate','toDate','asOf','horizon'])$('#'+id).addEventListener('change',render);$('#resetFilters').onclick=()=>{if(!D)return;let ds=D.log.items.map(x=>x.datetime.slice(0,10)).sort();$('#fromDate').value=ds[0];$('#toDate').value=ds.at(-1);$('#asOf').value=D.stock.meta.as_of;$('#horizon').value='90';render()};$('#search').oninput=applyFilter;$('#statusFilter').onchange=applyFilter;$('#prev').onclick=()=>{page--;renderTable()};$('#next').onclick=()=>{page++;renderTable()};$('#exportBtn').onclick=csv;$('#exportTable').onclick=csv;autoLoad();
</script></body></html>
